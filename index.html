<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>전도회별 집밥프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 밝은 보랏빛 무대 위에 색깔 카드가 놓이는 퀴즈쇼 화면. 남전도회=파랑, 여전도회=분홍. */
:root{
  --bg:#F3F0FF; --card:#FFFFFF; --ink:#27204D; --mute:#756F96; --line:#E0DAF7;
  --main:#6B4BF0; --main-d:#4D30C9; --sun:#FFC93C;
  --men:#2F7BF5; --women:#EE4E8B; --ok:#16A869; --bad:#E5484D;
  --a0:#EF4F6B; --a1:#2F7BF5; --a2:#F2A900; --a3:#1BAA6E;
  --disp:"Jua","Noto Sans KR",sans-serif; --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font-family:var(--body);color-scheme:light;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hide{display:none!important}
.btn{background:var(--main);color:#fff;font-family:var(--disp);font-size:1.15rem;padding:.7em 1.4em;border-radius:999px;box-shadow:0 4px 0 var(--main-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--main-d)}
.btn:disabled{background:#C9C3E6;box-shadow:0 4px 0 #ADA6D0;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--main);box-shadow:0 0 0 2px var(--line) inset}
.btn.sm{font-size:.95rem;padding:.45em 1em;box-shadow:none}
.btn.warn{background:#fff;color:var(--bad);box-shadow:0 0 0 2px #F5C6C8 inset}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--bad);margin-right:.4em}
.dot.on{background:var(--ok)}

/* ───────── 진행자 화면 ───────── */
#host{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:10px 22px;background:var(--main);color:#fff;flex-wrap:wrap}
.top h1{font-family:var(--disp);font-weight:400;font-size:1.5rem;margin-right:auto}
.top .pill{background:rgba(255,255,255,.18);border-radius:999px;padding:.3em .9em;font-size:.9rem;font-weight:500}
.top .tab{color:#fff;padding:.35em .9em;border-radius:999px;font-weight:700;font-size:.95rem;opacity:.75}
.top .tab.on{background:#fff;color:var(--main);opacity:1}
#stage{flex:1;min-height:0;padding:2.2vh 2.4vw;display:flex;flex-direction:column;overflow:auto}
.bar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:#fff;border-top:2px solid var(--line);flex-wrap:wrap}
.bar .info{margin-right:auto;color:var(--mute);font-weight:500}

.lobby{flex:1;display:grid;grid-template-columns:minmax(260px,34vw) 1fr;gap:2.4vw;min-height:0}
.join{background:var(--card);border-radius:28px;padding:2.4vh 1.6vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;text-align:center}
.join h2{font-family:var(--disp);font-weight:400;font-size:clamp(1.3rem,2.3vw,2.4rem)}
.qr{width:min(100%,46vh);aspect-ratio:1;background:#fff;border:6px solid var(--main);border-radius:20px;padding:8px}
.qr svg{width:100%;height:100%;display:block}
.link{font-size:clamp(.8rem,1.1vw,1.1rem);color:var(--mute);word-break:break-all;user-select:all}
.code{font-family:var(--disp);font-size:clamp(1.6rem,3vw,3rem);letter-spacing:.12em;color:var(--main)}
.warnbox{background:#FFF4D6;border-radius:12px;padding:.6em 1em;font-size:.9rem;color:#7A5300}
.teams{display:flex;flex-direction:column;gap:2vh;min-height:0}
.grp{background:var(--card);border-radius:28px;padding:2vh 1.6vw}
.grp h3{font-family:var(--disp);font-weight:400;font-size:clamp(1.1rem,1.8vw,1.9rem);margin-bottom:1.2vh;display:flex;align-items:center;gap:.5em}
.grp h3 small{font-family:var(--body);font-size:.6em;color:var(--mute);font-weight:500}
.grp.m h3{color:var(--men)} .grp.w h3{color:var(--women)}
.row .sc{white-space:nowrap}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:1vh .8vw;font-size:clamp(.95rem,1.5vw,1.6rem)}
.chip{font-family:var(--disp);text-align:center;padding:.5em .3em;border-radius:14px;background:#F1EFF8;color:#B1ABCB;border:2px dashed #D5CFEC}
.grp.m .chip.on{background:var(--men);color:#fff;border:2px solid var(--men)}
.grp.w .chip.on{background:var(--women);color:#fff;border:2px solid var(--women)}

.qhead{display:flex;align-items:center;gap:1.4vw;margin-bottom:1.6vh}
.qno{font-family:var(--disp);background:var(--main);color:#fff;border-radius:999px;padding:.25em 1em;font-size:clamp(1rem,1.7vw,1.8rem);white-space:nowrap}
.tbar{flex:1;height:1.8vh;min-height:10px;background:#fff;border-radius:999px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--sun);border-radius:999px;transition:width .1s linear}
.tnum{font-family:var(--disp);font-size:clamp(1.6rem,3.4vw,3.6rem);min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.qtext{background:var(--card);border-radius:28px;padding:3vh 2.4vw;font-family:var(--disp);font-size:clamp(1.5rem,3.6vw,4rem);line-height:1.3;text-align:center;text-wrap:balance;display:flex;align-items:center;justify-content:center;flex:1;min-height:16vh}
.qtext.small{flex:0 0 auto;min-height:0;font-size:clamp(1.2rem,2.3vw,2.5rem);padding:2vh 2vw}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.2vw;margin-top:1.8vh}
.opt{display:flex;align-items:center;gap:.7em;color:#fff;border-radius:22px;padding:.7em 1em;font-family:var(--disp);font-size:clamp(1.2rem,2.6vw,2.9rem);min-height:10vh;position:relative}
.opt .sh{font-size:.8em;opacity:.9}
.opt .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:999px;padding:.05em .7em;font-size:.7em}
.c0{background:var(--a0)} .c1{background:var(--a1)} .c2{background:var(--a2)} .c3{background:var(--a3)}
.opt.dim{opacity:.28}
.opt.right{outline:.4vw solid var(--ink)}
.opt.right::after{content:"정답";position:absolute;top:-.7em;right:1em;background:var(--ink);color:#fff;font-size:.5em;padding:.2em .9em;border-radius:999px}
.shortnote{margin-top:1.8vh;text-align:center;font-family:var(--disp);font-size:clamp(1.1rem,2vw,2.2rem);color:var(--mute)}
.subs{margin-top:1.8vh;display:flex;flex-wrap:wrap;gap:.8vh .6vw;align-items:center;min-height:5vh;font-size:clamp(.9rem,1.4vw,1.5rem)}
.subs b{font-family:var(--disp);font-weight:400;color:var(--mute);margin-right:.4em}
.sub{font-family:var(--disp);padding:.25em .8em;border-radius:999px;color:#fff;animation:pop .25s}
.sub.m{background:var(--men)} .sub.w{background:var(--women)}
.sub small{opacity:.85;font-family:var(--body);font-size:.75em;margin-left:.35em}
@keyframes pop{from{transform:scale(.6);opacity:0}}

.reveal{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:2vw;min-height:0}
.reveal .left{display:flex;flex-direction:column;min-height:0}
.answer-big{margin-top:1.8vh;background:var(--ok);color:#fff;border-radius:22px;padding:.5em 1em;text-align:center;font-family:var(--disp);font-size:clamp(1.4rem,3vw,3.2rem)}
.fast{background:var(--sun);border-radius:28px;padding:2.2vh 1.6vw;text-align:center}
.fast .lab{font-weight:700;font-size:clamp(.9rem,1.3vw,1.4rem)}
.fast .who{font-family:var(--disp);font-size:clamp(2rem,4.6vw,5rem);line-height:1.15}
.fast .how{font-weight:700;font-size:clamp(1rem,1.6vw,1.7rem)}
.reslist{margin-top:1.6vh;background:var(--card);border-radius:22px;padding:1.4vh 1.2vw;overflow:auto;flex:1;min-height:0}
.res{display:grid;grid-template-columns:2em 1fr auto 4.2em;gap:.8em;align-items:center;padding:.38em .5em;border-radius:10px;font-size:clamp(.9rem,1.35vw,1.45rem)}
.res:nth-child(odd){background:#F7F5FF}
.res .n{font-family:var(--disp);color:var(--mute);text-align:center}
.res .nm{font-family:var(--disp)} .res .nm.m{color:var(--men)} .res .nm.w{color:var(--women)}
.chip small{display:block;font-family:var(--body);font-size:.6em;font-weight:700}
.row .nm small{font-family:var(--body);font-size:.6em;color:var(--mute);margin-left:.5em}
.res .nm small{font-family:var(--body);color:var(--mute);font-size:.75em;margin-left:.5em}
.res .tm{font-variant-numeric:tabular-nums;color:var(--mute)}
.res .pt{font-weight:900;font-variant-numeric:tabular-nums;color:var(--ok);min-width:3.6em;text-align:right}
.res.x .pt{color:var(--bad)} .res.x .nm{opacity:.6}
.right-col{display:flex;flex-direction:column;min-height:0}

.rank{flex:1;display:grid;grid-template-columns:1fr 2fr;gap:2vw;min-height:0}
.rank .grp{display:flex;flex-direction:column;min-height:0}
.rows{flex:1;display:grid;gap:.9vh .9vw;grid-auto-flow:column;min-height:0}
.grp.m .rows{grid-template-rows:repeat(6,1fr)}
.grp.w .rows{grid-template-rows:repeat(8,1fr);grid-template-columns:1fr 1fr}
.row{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:.6em;background:#F7F5FF;border-radius:14px;padding:.2em .8em;font-size:clamp(.95rem,1.7vw,1.9rem);position:relative;overflow:hidden;min-height:2em}
.row .fill{position:absolute;inset:0 auto 0 0;opacity:.16;border-radius:14px}
.grp.m .fill{background:var(--men)} .grp.w .fill{background:var(--women)}
.row>*{position:relative}
.row .rk{font-family:var(--disp);text-align:center;color:var(--mute)}
.row .nm{font-family:var(--disp)}
.row .sc{font-weight:900;font-variant-numeric:tabular-nums}
.row.r1{background:var(--sun)} .row.r1 .rk{color:var(--ink)}
.row.off .nm{opacity:.45}
.ranktitle{font-family:var(--disp);font-size:clamp(1.4rem,2.6vw,2.8rem);text-align:center;margin-bottom:1.6vh}

/* 문제 관리 */
.mgr{max-width:980px;margin:0 auto;width:100%}
.mgr .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.mgr .tools p{color:var(--mute);font-size:.95rem;margin-right:auto}
.qi{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:2.4em 1fr auto;gap:12px;align-items:center}
.qi .no{font-family:var(--disp);font-size:1.3rem;color:var(--main);text-align:center}
.qi .tx{font-weight:700} .qi .meta{color:var(--mute);font-size:.9rem;margin-top:3px}
.qi .acts{display:flex;gap:6px;flex-wrap:wrap}
.qi.cur{box-shadow:0 0 0 3px var(--sun) inset}
dialog{border:0;border-radius:22px;padding:22px;width:min(640px,94vw);margin:auto;color:var(--ink)}
dialog::backdrop{background:rgba(39,32,77,.55)}
dialog h2{font-family:var(--disp);font-weight:400;margin-bottom:14px}
.top .qrbtn{color:#fff;font-weight:700;background:rgba(255,255,255,.3)}
.menu{background:var(--card);border-radius:28px;padding:2.4vh 1.8vw;display:flex;flex-direction:column;gap:1.4vh;min-height:0}
.menu h2{font-family:var(--disp);font-weight:400;font-size:clamp(1.3rem,2.3vw,2.4rem)}
.mi{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.1em;text-align:left;padding:.45em 1.2em;border-radius:20px;background:#F3F0FF;border:2px solid var(--line);min-height:3.6em}
.mi b{font-family:var(--disp);font-weight:400;font-size:clamp(1.15rem,2vw,2.1rem);color:var(--main)}
.mi span{color:var(--mute);font-size:clamp(.85rem,1.1vw,1.15rem)}
.mi:hover{border-color:var(--main)}
.mi.go{background:var(--main);border-color:var(--main)} .mi.go b{color:#fff} .mi.go span{color:#fff;opacity:.85}
.mi.danger b{color:var(--bad)}
dialog.qrd{width:min(94vw,86vh);text-align:center}
.qrdbody{display:flex;flex-direction:column;align-items:center;gap:8px}
.qrdbody .qr{width:min(100%,62vh)}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-weight:700;font-size:.92rem}
.f input[type=text],.f input[type=number],.f textarea,.f select{font:inherit;padding:.6em .8em;border:2px solid var(--line);border-radius:12px;width:100%;background:#fff;color:var(--ink)}
.crow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-bottom:6px}
.crow input[type=radio]{width:1.3em;height:1.3em;accent-color:var(--ok)}
.dbtn{display:flex;gap:10px;justify-content:flex-end}
.hint{color:var(--mute);font-size:.85rem}
.implist{max-height:46vh;overflow:auto;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:.92rem}
.implist div{padding:.35em 0;border-bottom:1px solid var(--line)} .implist div:last-child{border:0}
.implist .e{color:var(--bad)} .implist small{color:var(--mute);margin-left:.4em}

/* ───────── 참가자(휴대폰) 화면 ───────── */
#player{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:14px 16px 24px}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phead .me{font-family:var(--disp);font-size:1.25rem;padding:.25em .9em;border-radius:999px;color:#fff;background:var(--main)}
.phead .me.m{background:var(--men)} .phead .me.w{background:var(--women)}
.phead .st{margin-left:auto;font-size:.8rem;color:var(--mute)}
.phead .chg{font-size:.8rem;color:var(--mute);text-decoration:underline}
.pbody{flex:1;display:flex;flex-direction:column;gap:14px}
.pcard{background:var(--card);border-radius:22px;padding:22px 18px;text-align:center}
.pcard h2{font-family:var(--disp);font-weight:400;font-size:1.6rem;line-height:1.3;text-wrap:balance}
.pcard p{color:var(--mute);margin-top:8px}
.pcard .big{font-family:var(--disp);font-size:3rem;line-height:1.2}
.pcard.good{background:var(--ok);color:#fff} .pcard.badc{background:var(--bad);color:#fff}
.pcard.good p,.pcard.badc p{color:#fff;opacity:.92}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.pick h3{font-family:var(--disp);font-weight:400;font-size:1.2rem;margin:10px 0 8px}
.pick h3.m{color:var(--men)} .pick h3.w{color:var(--women)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid button{font-family:var(--disp);font-size:1.1rem;padding:.9em .2em;border-radius:14px;color:#fff}
.pgrid.m button{background:var(--men)} .pgrid.w button{background:var(--women)}
.ptimer{height:10px;background:#fff;border-radius:999px;overflow:hidden}
.ptimer i{display:block;height:100%;background:var(--sun);width:100%}
.pq{font-family:var(--disp);font-size:1.35rem;line-height:1.35;background:var(--card);border-radius:18px;padding:16px;text-align:center;text-wrap:balance}
.popts{display:grid;gap:10px}
.popts.two{grid-template-columns:1fr 1fr}
.popt{color:#fff;font-family:var(--disp);font-size:1.3rem;border-radius:18px;padding:1em .8em;display:flex;gap:.6em;align-items:center;text-align:left;min-height:68px;opacity:.9}
.popts.two .popt{justify-content:center;font-size:3rem;min-height:120px}
.popt.sel{opacity:1;outline:5px solid var(--ink);outline-offset:-5px}
.popts.has .popt:not(.sel){opacity:.4}
.pin{font:inherit;font-size:1.4rem;font-weight:700;text-align:center;padding:.7em;border:3px solid var(--main);border-radius:16px;width:100%;background:#fff;color:var(--ink)}
.submit{font-size:1.5rem;padding:.75em;width:100%}
@media (max-width:900px){
  .lobby,.reveal,.rank{grid-template-columns:1fr} #stage{overflow:auto}
  .grp.w .rows,.grp.m .rows{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="host" class="hide">
  <div class="top">
    <h1>전도회별 집밥프로젝트</h1>
    <span class="pill"><span class="dot" id="hdot"></span><span id="hconn">연결 중…</span></span>
    <span class="pill" id="honline">접속 0 / 22</span>
    <button class="pill qrbtn" id="bQr">QR 코드 보기</button>
    <button class="tab on" id="tabHome">메인</button>
    <button class="tab" id="tabPlay">대회 진행</button>
    <button class="tab" id="tabMgr">문제 관리</button>
  </div>
  <div id="stage"></div>
  <div class="bar" id="bar"></div>
</div>

<div id="player" class="hide">
  <div class="phead" id="phead"></div>
  <div class="pbody" id="pbody"></div>
</div>

<dialog id="qrd" class="qrd">
  <h2>휴대폰으로 QR을 찍어 주세요</h2>
  <div id="qrdBody" class="qrdbody"></div>
  <div class="dbtn" style="justify-content:center;margin-top:12px"><button type="button" class="btn" id="qrdClose">닫기</button></div>
</dialog>
<dialog id="imp">
  <h2 id="impTitle">파일에서 문제 읽기</h2>
  <p id="impSum" style="margin-bottom:10px;font-weight:700"></p>
  <div id="impList" class="implist"></div>
  <div class="dbtn" style="margin-top:14px;flex-wrap:wrap"><button type="button" class="btn ghost sm" id="impCancel">취소</button><button type="button" class="btn warn sm" id="impReplace">기존 문제를 지우고 교체</button><button type="button" class="btn sm" id="impAdd">기존 문제 뒤에 추가</button></div>
</dialog>
<dialog id="dlg">
  <form id="qform">
    <h2 id="dlgTitle">문제 추가</h2>
    <div class="f"><label for="fType">문제 유형</label>
      <select id="fType"><option value="choice">객관식 (4지선다)</option><option value="ox">O / X</option><option value="short">주관식 (단답형)</option></select></div>
    <div class="f"><label for="fText">문제</label><textarea id="fText" rows="3" required></textarea></div>
    <div class="f" id="fChoiceBox"><label>보기 (정답인 보기 앞의 동그라미를 선택)</label>
      <div class="crow"><input type="radio" name="fAns" id="fA0" value="0" checked><input type="text" id="fC0" placeholder="보기 1"></div>
      <div class="crow"><input type="radio" name="fAns" id="fA1" value="1"><input type="text" id="fC1" placeholder="보기 2"></div>
      <div class="crow"><input type="radio" name="fAns" id="fA2" value="2"><input type="text" id="fC2" placeholder="보기 3 (비워도 됨)"></div>
      <div class="crow"><input type="radio" name="fAns" id="fA3" value="3"><input type="text" id="fC3" placeholder="보기 4 (비워도 됨)"></div>
    </div>
    <div class="f hide" id="fOxBox"><label for="fOx">정답</label><select id="fOx"><option value="O">O (맞다)</option><option value="X">X (틀리다)</option></select></div>
    <div class="f hide" id="fShortBox"><label for="fShort">정답</label><input type="text" id="fShort" placeholder="예: 베들레헴">
      <span class="hint">인정할 답이 여러 개면 쉼표로 구분하세요. 띄어쓰기는 무시하고 채점합니다.</span></div>
    <div class="f"><label for="fTime">제한 시간 (초)</label><input type="number" id="fTime" min="5" max="300" value="20"></div>
    <p class="hint" id="fErr" style="color:var(--bad);margin-bottom:10px"></p>
    <div class="dbtn"><button type="button" class="btn ghost sm" id="fCancel">취소</button><button type="submit" class="btn sm">저장</button></div>
  </form>
</dialog>

<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],

 {type:"choice",text:"하나님께서 천지를 창조하실 때 첫째 날에 만드신 것은 무엇일까요?",choices:["빛","하늘","땅과 바다","해와 달"],answer:0,time:20},
 {type:"choice",text:"노아의 홍수 때 비는 땅에 며칠 동안 쏟아졌을까요?",choices:["7일","40일","100일","150일"],answer:1,time:20},
 {type:"ox",text:"예수님의 열두 제자 중 마태는 세리였다.",answer:"O",time:15},
 {type:"choice",text:"다윗이 골리앗을 쓰러뜨릴 때 사용한 것은 무엇일까요?",choices:["칼","창","물맷돌","활"],answer:2,time:20},
 {type:"short",text:"예수님께서 태어나신 유대 땅의 마을 이름은 무엇일까요?",answers:["베들레헴"],time:25},
 {type:"choice",text:"신약성경은 모두 몇 권일까요?",choices:["27권","29권","39권","66권"],answer:0,time:20},
 {type:"ox",text:"요나는 큰 물고기 뱃속에서 밤낮 사흘을 지냈다.",answer:"O",time:15},
 {type:"short",text:"모세의 뒤를 이어 이스라엘 백성을 가나안 땅으로 이끈 지도자는 누구일까요?",answers:["여호수아"],time:25}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rid=n=>Array.from({length:n},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join("");
const norm=s=>String(s??"").toLowerCase().replace(/[\s.,!?·'"‘’“”()\-]/g,"");
const sec=ms=>(ms/1000).toFixed(2)+"초";
function answerText(q){return q.type==="choice"?q.choices[q.answer]:q.type==="ox"?q.answer:q.answers[0]}
function shownAnswer(q,a){return q.type==="choice"?(q.choices[a]??""):String(a??"")}
function ranked(g,sc){ // 평균 점수 순, 같은 점수는 같은 등수, 참여자가 없으면 순위 없음
  const arr=TEAMS.filter(t=>t.g===g).map(t=>{const x=sc&&sc[t.id];return {...t,n:x?x.n:0,sum:x?x.sum:0,score:x&&x.n?x.avg:-1}}).sort((a,b)=>b.score-a.score);
  arr.forEach((t,i)=>{t.rank=t.n?(i>0&&arr[i-1].score===t.score?arr[i-1].rank:i+1):null});
  return arr;
}
const PTS=10; // 정답 1개당 점수
const f1=v=>(Math.round(v*10)/10).toFixed(1);
function grade(type,key,a){return type==="short"?key.some(x=>norm(x)===norm(a)&&norm(a)!==""):a===key}
function connect(url,id){return mqtt.connect(url,{clientId:id,clean:true,reconnectPeriod:2000,connectTimeout:7000,keepalive:20})}
const hp=new URLSearchParams(location.hash.slice(1));
if(hp.get("r")) startPlayer(hp.get("r").toUpperCase(),+hp.get("b")||0); else startHost();

/* ───────── 진행자 ───────── */
function startHost(){
  $("#host").classList.remove("hide");
  let Q=LS.get("bq_questions",null)||JSON.parse(JSON.stringify(SAMPLE));
  let G=LS.get("bq_game",null);if(!G||!G.members)G=fresh();
  let back="home", tab="home", client=null, online=false, devices={}, lastOnlineKey="", resetArmed=0, editing=-1;
  function fresh(){return {room:rid(5),b:-1,phase:"lobby",qi:-1,qid:0,startAt:0,dur:20,cur:null,answers:{},members:{},done:0}}
  const save=()=>LS.set("bq_game",G);
  const saveQ=()=>LS.set("bq_questions",Q);
  const pre=()=>"bq26/"+G.room;
  const onlinePids=()=>{const now=Date.now();return Object.keys(devices).filter(c=>now-devices[c].t<30000)};
  const onlineTeams=()=>{const m=new Map();for(const c of onlinePids())m.set(devices[c].team,(m.get(devices[c].team)||0)+1);return m};
  function teamScores(){ // 전도회별 평균 = 참여자(한 번이라도 제출한 사람) 점수 합 ÷ 참여자 수
    const o={};for(const id in G.members){const m=G.members[id];if(!m.cnt)continue;const x=o[m.team]||(o[m.team]={sum:0,n:0});x.sum+=m.pts;x.n++}
    for(const t in o)o[t]={n:o[t].n,sum:o[t].sum,avg:Math.round(o[t].sum/o[t].n*100)/100};return o;
  }
  let pend=0;const schedule=()=>{if(pend)return;pend=setTimeout(()=>{pend=0;save();publish();if(tab==="play")render()},250)};
  const joinUrl=()=>location.origin+location.pathname+location.search+"#r="+G.room+"&b="+G.b;

  /* 연결: 공개 중계 서버를 차례로 시도 */
  async function pickBroker(){
    if(TEST_BROKER){G.b=0;return TEST_BROKER}
    const order=G.b>=0?[G.b,...BROKERS.keys()].filter((v,i,a)=>a.indexOf(v)===i):[...BROKERS.keys()];
    for(;;){
      for(const i of order){
        const ok=await new Promise(res=>{
          const c=mqtt.connect(BROKERS[i],{clientId:"bqp_"+rid(8),reconnectPeriod:0,connectTimeout:6000});
          const done=v=>{try{c.end(true)}catch(e){}res(v)};
          c.on("connect",()=>done(true));c.on("error",()=>done(false));c.on("close",()=>res(false));
          setTimeout(()=>done(false),7000);
        });
        if(ok){G.b=i;save();return BROKERS[i]}
      }
      $("#hconn").textContent="인터넷 연결을 확인하는 중…";
      await new Promise(r=>setTimeout(r,2000));
    }
  }
  pickBroker().then(url=>{
    client=connect(url,"bqh_"+G.room+"_"+rid(6));
    client.on("connect",()=>{online=true;conn();client.subscribe([pre()+"/hi",pre()+"/ans"],{qos:1});publish();render()});
    client.on("close",()=>{online=false;conn()});
    client.on("message",(topic,buf)=>{let m;try{m=JSON.parse(buf.toString())}catch(e){return}
      if(!m||!TEAM[m.team]||typeof m.pid!=="string"||!m.pid)return;
      const pid=m.pid.slice(0,16),name=String(m.name??"").trim().slice(0,12)||"이름없음";
      devices[pid]={team:m.team,name,t:Date.now()};
      if(topic.endsWith("/ans"))onAnswer(m,pid,name);
      checkOnline();
    });
  });
  function conn(){$("#hdot").classList.toggle("on",online);$("#hconn").textContent=online?"연결됨":"연결 중…"}
  function checkOnline(){const n=onlinePids().length,k=[...onlineTeams()].map(x=>x.join(":")).sort().join();$("#honline").textContent="접속 "+n+"명";
    if(k!==lastOnlineKey){lastOnlineKey=k;if(tab==="play"&&(G.phase==="lobby"||G.phase==="question"))render()}}

  function publish(){
    if(!client||!online)return;
    const s={ph:G.phase,qid:G.qid,n:G.qi+1,total:Q.length};
    if(G.cur&&(G.phase==="question"||G.phase==="reveal")){
      s.q={t:G.cur.type,x:G.cur.text,c:G.cur.choices||null};s.dur=G.dur;s.age=Date.now()-G.startAt;
    }
    if(G.phase!=="lobby"&&G.phase!=="question"){
      s.sc=teamScores();
      if(G.cur){s.ans=answerText(G.cur);s.key={t:G.cur.type,a:G.cur.type==="short"?G.cur.answers:G.cur.answer}}
    }
    client.publish(pre()+"/state",JSON.stringify(s),{qos:0,retain:true});
  }
  const ack=pid=>client.publish(pre()+"/ack/"+pid,JSON.stringify({q:G.qid}),{qos:1});
  function onAnswer(m,pid,name){
    if(m.q!==G.qid)return;
    if(G.answers[pid])return ack(pid); // 다시 보낸 답: 받았다고만 알려 줌
    if(G.phase!=="question")return;
    const arrival=Date.now()-G.startAt;
    let e=(typeof m.e==="number"&&m.e>0&&m.e<=arrival+250)?m.e:arrival;
    if(e>G.dur*1000+GRACE)return;
    e=Math.min(e,G.dur*1000);
    const a=G.cur.type==="choice"?(Number.isInteger(m.a)?m.a:-1):String(m.a??"").slice(0,40);
    const ok=grade(G.cur.type,G.cur.type==="short"?G.cur.answers:G.cur.answer,a);
    G.answers[pid]={a,e:Math.round(e),ok,team:m.team,name};
    ack(pid);schedule();
    const on=onlinePids();
    if(on.length>1&&on.every(c=>G.answers[c]))setTimeout(()=>{if(G.phase==="question")closeQ()},700);
  }
  function startQ(i){
    if(i>=Q.length)return;
    G.qi=i;G.qid++;G.cur=JSON.parse(JSON.stringify(Q[i]));G.answers={};G.dur=G.cur.time||20;G.startAt=Date.now();G.phase="question";
    save();publish();render();
  }
  function closeQ(){
    if(G.phase!=="question")return;
    for(const pid in G.answers){const a=G.answers[pid],m=G.members[pid]||(G.members[pid]={pts:0,cnt:0});
      m.team=a.team;m.name=a.name;m.cnt++;if(a.ok)m.pts+=PTS}
    G.done=(G.done||0)+1;G.phase="reveal";save();publish();render();
  }
  function go(phase){G.phase=phase;save();publish();render()}
  function resetAll(){const b=G.b;G=fresh();G.b=b;devices={};save();location.reload()}

  setInterval(()=>{
    if(G.phase==="question"){
      const rem=G.dur*1000-(Date.now()-G.startAt);
      const bar=$("#tfill"),num=$("#tnum");
      if(bar)bar.style.width=Math.max(0,rem/(G.dur*10))+"%";
      if(num)num.textContent=Math.max(0,Math.ceil(rem/1000));
      if(rem<=-GRACE)closeQ();
    }
  },100);
  setInterval(()=>{publish();checkOnline()},2500);
  if(SELF)setInterval(()=>{fetch("health",{cache:"no-store"}).catch(()=>{})},240000); // 무료 서버가 잠들지 않게

  /* 화면 그리기 */
  function subsHtml(){
    const list=Object.values(G.answers).sort((a,b)=>a.e-b.e);
    return `<div class="subs"><b>제출 ${list.length}명 / 접속 ${onlinePids().length}명</b>`+list.slice(0,12).map(a=>`<span class="sub ${TEAM[a.team].g}">${esc(a.name)}<small>${esc(TEAM[a.team].name)}</small></span>`).join("")+(list.length>12?`<b>외 ${list.length-12}명</b>`:"")+`</div>`;
  }
  function optsHtml(q,reveal){
    if(q.type==="short")return reveal?`<div class="answer-big">정답 · ${esc(answerText(q))}</div>`:`<div class="shortnote">휴대폰에 답을 직접 입력해 주세요</div>`;
    const items=q.type==="ox"?["O","X"]:q.choices;
    return `<div class="opts">`+items.map((c,i)=>{
      const val=q.type==="ox"?c:i, right=val===q.answer;
      const cnt=reveal?Object.values(G.answers).filter(a=>a.a===val).length:null;
      return `<div class="opt c${q.type==="ox"?(i?0:1):i} ${reveal?(right?"right":"dim"):""}"><span class="sh">${q.type==="ox"?"":SHAPES[i]}</span><span>${esc(c)}</span>${reveal?`<span class="cnt">${cnt}명</span>`:""}</div>`;
    }).join("")+`</div>`;
  }
  function groupChips(g){
    const on=onlineTeams(),ts=TEAMS.filter(t=>t.g===g);
    return `<div class="grp ${g}"><h3>${GNAME[g]} <small>${ts.reduce((n,t)=>n+(on.get(t.id)||0),0)}명 접속</small></h3><div class="chips">`+
      ts.map(t=>`<div class="chip ${on.has(t.id)?"on":""}">${esc(t.name)}${on.has(t.id)?`<small>${on.get(t.id)}명</small>`:""}</div>`).join("")+`</div></div>`;
  }
  function rankHtml(title,bySum){ // bySum: 누적 점수(합계) 순으로 보기
    const sc=teamScores(), max=PTS*Math.max(1,G.done||0), maxSum=Math.max(1,...Object.values(sc).map(x=>x.sum));
    const col=g=>{let arr=ranked(g,sc);
      if(bySum){arr=arr.slice().sort((a,b)=>b.sum-a.sum||b.score-a.score);arr.forEach((t,i)=>{t.rank=t.n?(i>0&&arr[i-1].sum===t.sum?arr[i-1].rank:i+1):null})}
      return `<div class="grp ${g}"><h3>${GNAME[g]} <small>${bySum?"누적 점수 순":"평균 점수 순"}</small></h3><div class="rows">`+arr.map(t=>
      `<div class="row ${t.rank===1?"r1":""} ${t.n?"":"off"}"><span class="fill" style="width:${t.n?Math.min(100,bySum?t.sum/maxSum*100:t.score/max*100):0}%"></span><span class="rk">${t.rank??"-"}</span><span class="nm">${esc(t.name)}${t.n?`<small>${t.n}명 · ${bySum?"평균 "+f1(t.score):"누적 "+t.sum+"점"}</small>`:""}</span><span class="sc">${t.n?(bySum?t.sum.toLocaleString()+"점":f1(t.score)):"-"}</span></div>`).join("")+`</div></div>`};
    return `<div class="ranktitle">${title}</div><div class="rank">${col("m")}${col("w")}</div>`;
  }
  function qrSvg(text){const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}

  function joinHtml(){
    return `<div class="join"><h2>휴대폰으로 QR을 찍어 주세요</h2>`+
      (G.b<0?`<p class="hint">연결 준비 중…</p>`:`<div class="qr">${qrSvg(joinUrl())}</div><div class="link">${esc(joinUrl())}</div>`)+
      `<div class="code">${esc(G.room)}</div>`+
      (location.protocol==="file:"?`<div class="warnbox">지금은 내 컴퓨터의 파일로 열려 있어 휴대폰이 접속할 수 없습니다. 이 파일을 웹에 올린 주소로 열어 주세요.</div>`:"")+`</div>`;
  }
  function armReset(){if(resetArmed&&Date.now()-resetArmed<4000)return resetAll();resetArmed=Date.now();render();setTimeout(()=>{resetArmed=0;if(tab!=="mgr"&&G.phase!=="question")render()},4000)}
  function renderHome(){
    const started=G.phase!=="lobby",fin=G.phase==="final";
    const item=(id,cls,t,d)=>`<button class="mi ${cls}" id="${id}"><b>${t}</b><span>${d}</span></button>`;
    $("#stage").innerHTML=`<div class="lobby">${joinHtml()}<div class="menu"><h2>메인 메뉴</h2>`+
      item("mPlay","go",started?(fin?"최종 순위 보기":"대회 이어서 진행"):"대회 진행",started?(fin?"모든 문제가 끝났습니다":`${G.qi+1}번 문제까지 진행했습니다 · 전체 ${Q.length}문제`):"전도회 접속 현황을 보고 1번 문제를 시작합니다")+
      item("mMgr","","문제 관리",`문제 ${Q.length}개 · 직접 추가하거나 파일로 올립니다`)+
      item("mRank","","현재 순위","남전도회 · 여전도회 평균 점수 순위를 봅니다")+
      item("mSum","","전도회별 누적 점수","전도회마다 지금까지 쌓인 점수 합계를 봅니다")+
      item("mQr","","QR 코드 크게 보기","늦게 온 분이 접속할 수 있도록 화면 가득 띄웁니다")+
      item("mReset","danger",resetArmed?"한 번 더 누르면 모든 점수가 지워집니다":"새 대회 시작","점수와 진행 상황을 지우고 처음부터 시작합니다 (문제는 그대로)")+`</div></div>`;
    $("#bar").innerHTML=`<span class="info">대회 중에도 위쪽의 「QR 코드 보기」를 누르면 언제든 QR을 다시 띄울 수 있습니다</span>`;
    $("#mPlay").onclick=()=>{tab="play";render()};$("#mMgr").onclick=()=>{tab="mgr";render()};
    $("#mRank").onclick=()=>{back="home";tab="rank";render()};$("#mSum").onclick=()=>{back="home";tab="sum";render()};$("#mQr").onclick=showQr;$("#mReset").onclick=armReset;
  }
  function showQr(){
    $("#qrdBody").innerHTML=G.b<0?`<p class="hint">연결 준비 중…</p>`:`<div class="qr">${qrSvg(joinUrl())}</div><div class="link">${esc(joinUrl())}</div><div class="code">${esc(G.room)}</div>`;
    $("#qrd").showModal();
  }
  $("#bQr").onclick=showQr;$("#qrdClose").onclick=()=>$("#qrd").close();
  $("#tabHome").onclick=()=>{tab="home";render()};
  function render(){
    $("#tabHome").classList.toggle("on",tab==="home"||((tab==="rank"||tab==="sum")&&back==="home"));$("#tabPlay").classList.toggle("on",tab==="play"||((tab==="rank"||tab==="sum")&&back==="play"));$("#tabMgr").classList.toggle("on",tab==="mgr");
    const st=$("#stage"),bar=$("#bar");
    if(tab==="mgr")return renderMgr();
    if(tab==="home")return renderHome();
    if(tab==="rank"||tab==="sum"){
      const by=tab==="sum";
      st.innerHTML=rankHtml(by?"전도회별 누적 점수":(G.qi>=0?`${G.qi+1}번 문제까지의 순위`:"현재 순위"),by);
      bar.innerHTML=`<span class="info">${by?"누적 점수 = 그 전도회 참여자들이 얻은 점수의 합계 (정답 1개 10점)":"순위 = 전도회 참여 인원의 평균 점수"} · 보기만 하는 화면입니다</span><button class="btn ghost" id="bSwap">${by?"평균 순위 보기":"누적 점수 보기"}</button><button class="btn" id="bHome">${back==="play"?"대회 진행으로":"메인으로"}</button>`;
      $("#bSwap").onclick=()=>{tab=by?"rank":"sum";render()};$("#bHome").onclick=()=>{tab=back;render()};return}
    const q=G.cur, last=G.qi>=Q.length-1;
    if(G.phase==="lobby"){
      st.innerHTML=`<div class="lobby">${joinHtml()}<div class="teams">${groupChips("m")}${groupChips("w")}</div></div>`;
      bar.innerHTML=`<span class="info">문제 ${Q.length}개 준비됨 · 전도회별 접속 인원이 표시됩니다</span><button class="btn" id="bNext" ${Q.length?"":"disabled"}>대회 시작 · 1번 문제</button>`;
      $("#bNext").onclick=()=>startQ(0);
    }else if(G.phase==="question"){
      st.innerHTML=`<div class="qhead"><span class="qno">문제 ${G.qi+1} / ${Q.length}</span><div class="tbar"><i id="tfill"></i></div><span class="tnum" id="tnum">${G.dur}</span></div>
        <div class="qtext">${esc(q.text)}</div>${optsHtml(q,false)}${subsHtml()}`;
      bar.innerHTML=`<span class="info">접속한 사람이 모두 제출하거나 시간이 끝나면 자동으로 마감됩니다</span><button class="btn" id="bClose">지금 마감</button>`;
      $("#bClose").onclick=closeQ;
    }else if(G.phase==="reveal"){
      const list=Object.values(G.answers).sort((a,b)=>a.e-b.e), fast=list.find(a=>a.ok), okN=list.filter(a=>a.ok).length;
      const per=TEAMS.map(t=>{const l=list.filter(a=>a.team===t.id);return {...t,n:l.length,c:l.filter(a=>a.ok).length}}).filter(t=>t.n).sort((a,b)=>b.c/b.n-a.c/a.n||b.n-a.n);
      st.innerHTML=`<div class="reveal"><div class="left"><div class="qhead"><span class="qno">문제 ${G.qi+1} / ${Q.length}</span></div>
        <div class="qtext small">${esc(q.text)}</div>${optsHtml(q,true)}</div>
        <div class="right-col"><div class="fast">`+(fast?`<div class="lab">가장 빠른 정답</div><div class="who">${esc(fast.name)}</div><div class="how">${esc(TEAM[fast.team].name)} · ${sec(fast.e)}</div>`:`<div class="lab">이번 문제</div><div class="who">정답 없음</div>`)+`</div>
        <div class="reslist">`+per.map((t,i)=>`<div class="res"><span class="n">${i+1}</span><span class="nm ${t.g}">${esc(t.name)}</span><span class="tm">${t.n}명 중 ${t.c}명 정답</span><span class="pt">${f1(t.c/t.n*PTS)}점</span></div>`).join("")+
        (per.length?"":`<p class="hint" style="padding:1em">제출한 사람이 없습니다.</p>`)+`</div></div></div>`;

  function openDlg(i){

  /* 파일로 문제 올리기 */
  let impQ=[];
  function makeQ(text,slots,ansRaw,timeRaw){ // slots: 보기 칸(빈칸 포함), 번호 정답은 칸 위치 기준
    text=String(text||"").trim();if(!text)return null;
    let ans=String(ansRaw??"").trim();const t=parseInt(timeRaw,10),time=t>0?Math.min(300,Math.max(5,t)):20;
    const keep=slots.map((c,k)=>({c:String(c??"").trim(),k})).filter(o=>o.c);
    if(!ans)return {err:"정답이 없습니다",text};
    if(keep.length===1)return {err:"보기가 1개뿐입니다",text};
    if(keep.length>=2){
      if(keep.length>4)return {err:"보기는 4개까지 가능합니다",text};
      const c="①②③④".indexOf(ans[0]);let pos=c>=0?c:(/^[1-4]\s*번?$/.test(ans)?parseInt(ans,10)-1:-1);
      let idx=pos>=0?keep.findIndex(o=>o.k===pos):-1;
      if(idx<0)idx=keep.findIndex(o=>norm(o.c)===norm(ans));
      if(idx<0)return {err:"정답 '"+ans+"'을(를) 보기에서 찾을 수 없습니다",text};
      return {type:"choice",text,choices:keep.map(o=>o.c),answer:idx,time};
    }
    if(/^(o|○|◯|맞다|참)$/i.test(ans))return {type:"ox",text,answer:"O",time};
    if(/^(x|×|✕|틀리다|거짓)$/i.test(ans))return {type:"ox",text,answer:"X",time};
    return {type:"short",text,answers:ans.split(/[,，]/).map(x=>x.trim()).filter(Boolean),time};
  }
  function rowsToQ(rows){
    rows=rows.map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(c=>c));
    if(!rows.length)return [];
    let col={q:0,c:[1,2,3,4],a:5,t:6};
    const h=rows[0],hq=h.findIndex(c=>/^문제/.test(c)),ha=h.findIndex(c=>/^(정답|답)/.test(c));
    if(hq>=0&&ha>=0){
      const hc=h.map((c,i)=>/^보기/.test(c)?i:-1).filter(i=>i>=0);
      col={q:hq,c:hc,a:ha,t:h.findIndex(c=>/시간/.test(c))};rows=rows.slice(1);
    }else if(rows.every(r=>/^\d+$/.test(r[0])))col={q:1,c:[2,3,4,5],a:6,t:7}; // 첫 칸이 번호
    return rows.map(r=>makeQ(r[col.q],col.c.map(i=>r[i]),r[col.a],col.t>=0?r[col.t]:"")).filter(Boolean);
  }
  function textToQ(txt){
    return txt.replace(/\r/g,"").split(/\n\s*\n/).map(block=>{
      const lines=block.split("\n").map(l=>l.trim()).filter(Boolean);if(!lines.length)return null;
      const text=lines[0].replace(/^(문제\s*)?\d+\s*[.)번:]\s*/,"");let ans="",time="";const ch=[];
      for(const l of lines.slice(1)){let m;
        if(m=l.match(/^(정답|답)\s*[:：]?\s*(.*)$/))ans=m[2];
        else if(m=l.match(/^(제한\s*)?시간\s*[:：]?\s*(\d+)/))time=m[2];
        else ch.push(l.replace(/^([①②③④]|\(?\d\)|\d\.|[-•·])\s*/,""));
      }
      return makeQ(text,ch,ans,time);
    }).filter(Boolean);
  }
  function decode(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){return new TextDecoder("euc-kr").decode(buf)}}
  async function importFile(f){
    $("#qFileIn").value="";
    const name=f.name.toLowerCase();let list=[],fail="";
    try{
      const buf=await f.arrayBuffer();
      if(name.endsWith(".txt"))list=textToQ(decode(buf).replace(/^\uFEFF/,""));
      else if(name.endsWith(".csv")||name.endsWith(".xlsx")){
        const wb=name.endsWith(".csv")?XLSX.read(decode(buf).replace(/^\uFEFF/,""),{type:"string",raw:true}):XLSX.read(buf,{type:"array"});
        list=rowsToQ(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""}));
      }else fail="엑셀(.xlsx), CSV(.csv), 메모장(.txt) 파일만 올릴 수 있습니다. 한글(.hwp)이나 워드 파일은 내용을 메모장에 붙여 넣어 .txt로 저장해 주세요.";
    }catch(e){fail="파일을 읽지 못했습니다. 양식을 확인해 주세요."}
    impQ=list.filter(q=>!q.err);const bad=list.filter(q=>q.err);
    const tn={choice:"객관식",ox:"O/X",short:"주관식"};
    $("#impSum").textContent=fail||(impQ.length?`문제 ${impQ.length}개를 읽었습니다.`:"읽을 수 있는 문제가 없습니다.")+(bad.length?` 읽지 못한 문제 ${bad.length}개는 빼고 올립니다.`:"");
    $("#impList").innerHTML=bad.map(q=>`<div class="e">✕ ${esc(q.text)}<small>${esc(q.err)}</small></div>`).join("")+impQ.map((q,i)=>`<div>${i+1}. ${esc(q.text)}<small>${tn[q.type]} · 정답 ${esc(q.type==="short"?q.answers.join(", "):answerText(q))} · ${q.time}초</small></div>`).join("");
    $("#impList").classList.toggle("hide",!list.length);
    $("#impAdd").classList.toggle("hide",!impQ.length);$("#impReplace").classList.toggle("hide",!impQ.length);
    $("#imp").showModal();
  }
  $("#impCancel").onclick=()=>$("#imp").close();
  $("#impAdd").onclick=()=>{Q=Q.concat(impQ);saveQ();$("#imp").close();render()};

  function downloadTemplate(){

    const el=document.createElement("a");el.href=url;el.download="성경퀴즈_문제양식.xlsx";document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);

      if(keep.length<2)return err("보기를 2개 이상 입력해 주세요.");

function startPlayer(room,b){
  $("#player").classList.remove("hide");
  const pre="bq26/"+room;
  let pid=LS.get("bq_pid_"+room,null);if(!pid){pid=rid(10);LS.set("bq_pid_"+room,pid)}
  let team=LS.get("bq_team_"+room,null); if(!TEAM[team])team=null;
  let name=team?LS.get("bq_name_"+room,null):null;
  const mine=LS.get("bq_mine_"+room,{}); // 내가 낸 답 {문제번호:{a,ok}}
  let S=null, online=false, t0=0, curQ=-1, sel=null, sent=null, lastKey="", gotState=false;
  const client=connect(TEST_BROKER||BROKERS[b]||BROKERS[0],"bqu_"+room+"_"+pid+rid(3));
  client.on("connect",()=>{online=true;client.subscribe([pre+"/state",pre+"/ack/"+pid],{qos:1});hi();render(true)});
  client.on("close",()=>{online=false;render(true)});
  client.on("message",(t,buf)=>{let s;try{s=JSON.parse(buf.toString())}catch(e){return}
    if(!s)return;
    if(t.endsWith("/ack/"+pid)){
      if(sent&&!sent.ack&&s.q===sent.q){sent.ack=true;mine[sent.q]={a:sent.a};LS.set("bq_mine_"+room,mine);render(true)}
      return;
    }
    if(typeof s.ph!=="string")return;
    if(s.ph==="question"&&s.qid!==curQ){curQ=s.qid;t0=performance.now()-(s.age||0);sel=null;const o=mine[s.qid];sent=o?{q:s.qid,a:o.a,e:o.e,at:0,ack:!o.pend}:null}
    if(s.key&&mine[s.qid]&&mine[s.qid].pend){delete mine[s.qid];LS.set("bq_mine_"+room,mine)} // 끝내 전달되지 못한 답
    if(s.key&&mine[s.qid]&&mine[s.qid].ok===undefined){mine[s.qid].ok=grade(s.key.t,s.key.a,mine[s.qid].a);LS.set("bq_mine_"+room,mine)}
    S=s;gotState=true;render();
  });
  const pub=(topic,o)=>{if(online)client.publish(pre+"/"+topic,JSON.stringify(o),{qos:1})};
  const hi=()=>{if(team&&name)pub("hi",{team,pid,name})};
  setInterval(hi,10000);
  setInterval(()=>{ // 타이머 + 받았다는 답이 올 때까지 다시 보내기
    if(S&&S.ph==="question"){
      const f=$("#ptf");if(f)f.style.width=Math.max(0,100-(performance.now()-t0)/(S.dur*10))+"%";
      if(sent&&!sent.ack&&sent.q===S.qid&&Date.now()-sent.at>1500){sent.at=Date.now();pub("ans",{team,pid,name,q:sent.q,a:sent.a,e:sent.e})}
    }
  },200);
  function submit(a){
    if(!S||S.ph!=="question"||sent)return;
    const e=Math.round(performance.now()-t0);
    sent={q:S.qid,a,e,at:Date.now(),ack:false};mine[S.qid]={a,e,pend:true};LS.set("bq_mine_"+room,mine);pub("ans",{team,pid,name,q:S.qid,a,e});render(true);
  }
  const myPts=()=>Object.values(mine).filter(x=>x.ok).length*PTS;
  function head(){
    const t=TEAM[team];
    $("#phead").innerHTML=(t?`<span class="me ${t.g}">${esc(t.name)}${name?" · "+esc(name):""}</span><button class="chg" id="pchg">바꾸기</button>`:`<span class="me">전도회별 집밥프로젝트</span>`)+`<span class="st"><span class="dot ${online?"on":""}"></span>${online?"연결됨":"연결 중"}</span>`;
    const c=$("#pchg");if(c)c.onclick=()=>{team=null;name=null;LS.set("bq_team_"+room,null);render(true)};
  }
  function myRank(){if(!S||!S.sc)return null;return ranked(TEAM[team].g,S.sc).find(t=>t.id===team)}

        <input class="pin" id="pname" type="text" maxlength="12" autocomplete="name" placeholder="예: 홍길동" value="${esc(LS.get("bq_name_"+room,"")||"")}"><button class="btn submit" id="pnameOk">입장하기</button></div>`;

    if(S.ph==="lobby"){el.innerHTML=`<div class="center"><div class="pcard"><div class="big">${esc(name)}</div><h2>${esc(T.name)} 접속 완료!</h2><p>앞 화면에 문제가 나오면 이 화면에서 답을 고르고 제출해 주세요.</p></div></div>`;return}

      }
      const q=S.q;let body;
      if(q.t==="short")body=`<input class="pin" id="pin" type="text" maxlength="40" autocomplete="off" placeholder="정답을 입력하세요">`;
      else{const items=q.t==="ox"?["O","X"]:q.c;

      el.querySelectorAll(".popt").forEach(bn=>bn.onclick=()=>{sel=q.t==="ox"?bn.dataset.v:+bn.dataset.v;$("#popts").classList.add("has");el.querySelectorAll(".popt").forEach(x=>x.classList.toggle("sel",x===bn));$("#psub").disabled=false});
      $("#psub").onclick=()=>{if(q.t==="short"){const v=$("#pin").value.trim();if(!v){$("#pin").focus();return}submit(v)}else if(sel!==null)submit(sel)};
      const pin=$("#pin");if(pin)pin.onkeydown=e=>{if(e.key==="Enter")$("#psub").click()};
      return;
    }
    const r=myRank(), tl=r&&r.n?`<p>${esc(T.name)} 평균 ${f1(r.score)}점 · ${GNAME[T.g]} ${r.rank}위</p>`:"";
    if(S.ph==="reveal"){
      const m=mine[S.qid];
      el.innerHTML=`<div class="center">`+(m?(m.ok?`<div class="pcard good"><div class="big">정답!</div><h2>+${PTS}점</h2></div>`:`<div class="pcard badc"><div class="big">아쉬워요</div><p>정답은 ${esc(S.ans)}</p></div>`):`<div class="pcard"><h2>제출하지 못했어요</h2><p>정답은 ${esc(S.ans)}</p></div>`)+`<div class="pcard"><h2>내 점수 ${myPts()}점</h2>${tl}</div></div>`;return;
    }
    el.innerHTML=`<div class="center"><div class="pcard"><p>${S.ph==="final"?"최종 순위":"현재 순위"} · ${GNAME[T.g]}</p><div class="big">${r&&r.rank?r.rank+"위":"-"}</div><h2>${esc(T.name)} 평균 ${r&&r.n?f1(r.score):"0.0"}점</h2><p>${r&&r.n?r.n+"명 참여 · 누적 "+r.sum+"점 · ":""}내 점수 ${myPts()}점</p><p>${S.ph==="final"?"수고하셨습니다!":"다음 문제를 기다려 주세요."}</p></div></div>`;
  }
  render(true);
}
</script>
</body>
</html>
